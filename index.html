    <script>
      (function() {
        // Prevent uncaught TypeError when environment tries to set window.fetch
        window.addEventListener('error', function(e) {
          if (e && e.message && e.message.indexOf('Cannot set property fetch') !== -1) {
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        });

        // Provide setter for window.fetch so re-assignment succeeds safely
        try {
          var _f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _f;
            },
            set: function(val) {
              _f = val;
            }
          });
        } catch (err) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _pf = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function() {
                  return _f || _pf;
                },
                set: function(val) {
                  _f = val;
                }
              });
            }
          } catch (err2) {}
        }
      })();
    </script>
